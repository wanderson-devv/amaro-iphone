name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', 'wf-gestor/**']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            wf-gestor/package-lock.json

      - name: Build site principal
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build WF Gestor
        working-directory: wf-gestor
        run: |
          npm ci
          npm run build

      - name: Empacota WF Gestor em /wf-gestor
        run: |
          mkdir -p client/dist/wf-gestor
          cp -r wf-gestor/dist/. client/dist/wf-gestor/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
