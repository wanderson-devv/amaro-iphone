services:
  - type: web
    name: amaro-iphone-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
    plan: free
